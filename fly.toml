app = "simplea2a"
primary_region = "sjc"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = "data"
  destination = "/data"
  auto_extend_size_threshold = 80
  auto_extend_size_increment = "1GB"
  auto_extend_size_limit = "10GB"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[http_service.concurrency]
  type = "connections"
  soft_limit = 5000
  hard_limit = 10000
